<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>勤務日当計算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>勤務日当計算</h1>

      <div class="form-group">
        <label for="startDateTime">勤務開始日時</label>
        <input type="datetime-local" id="startDateTime">
      </div>

      <div class="form-group">
        <label for="endDateTime">勤務終了日時</label>
        <input type="datetime-local" id="endDateTime">
      </div>

      <div class="form-group">
        <label for="hourlyWage">時給（円）</label>
        <input type="number" id="hourlyWage" inputmode="decimal" min="0" step="1" value="1250">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="overtimeRate">残業 ＋％</label>
          <input type="number" id="overtimeRate" inputmode="decimal" min="0" step="0.1" value="25">
        </div>

        <div class="form-group">
          <label for="nightRate">深夜 ＋％</label>
          <input type="number" id="nightRate" inputmode="decimal" min="0" step="0.1" value="25">
        </div>
      </div>

      <button id="calculateBtn" type="button">計算する</button>

      <p id="errorMessage" class="error" aria-live="polite"></p>
    </section>

    <section class="card result-card">
      <h2>計算結果</h2>

      <dl class="result-list">
        <div>
          <dt>総勤務時間</dt>
          <dd id="totalHours">-</dd>
        </div>

        <div>
          <dt>通常時間</dt>
          <dd id="regularHours">-</dd>
        </div>

        <div>
          <dt>通常時給</dt>
          <dd id="regularHourlyRate">-</dd>
        </div>

        <div>
          <dt>残業時間</dt>
          <dd id="overtimeHours">-</dd>
        </div>

        <div id="overtimeHourlyRateRow" hidden>
          <dt>残業時給</dt>
          <dd id="overtimeHourlyRate">-</dd>
        </div>

        <div>
          <dt>深夜時間</dt>
          <dd id="nightHours">-</dd>
        </div>

        <div id="nightHourlyRateRow" hidden>
          <dt>深夜時給</dt>
          <dd id="nightHourlyRate">-</dd>
        </div>

        <div>
          <dt>残業＋深夜の重複時間</dt>
          <dd id="overtimeNightHours">-</dd>
        </div>

        <div id="overtimeNightHourlyRateRow" hidden>
          <dt>残業＋深夜時給</dt>
          <dd id="overtimeNightHourlyRate">-</dd>
        </div>
      </dl>

      <div class="pay">
        <span>日当</span>
        <strong id="dailyPay">- 円</strong>
      </div>
    </section>

    <section class="card history-total-card">
      <div class="history-total">
        <span>履歴合計</span>
        <strong id="historyTotalPay">0 円</strong>
      </div>
    </section>

    <section class="card">
      <div class="history-header">
        <h2>計算履歴</h2>
      </div>

      <div id="historyList" class="history-list">
        <p class="empty">履歴はありません。</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
